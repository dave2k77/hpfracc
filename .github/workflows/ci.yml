name: CI

on:
  push:
  pull_request:

env:
  JAX_PLATFORMS: cpu

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.21"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Sync locked development environment
        run: uv sync --locked --extra dev
      - name: Record runtime context
        run: uv run --frozen python -c "import json; import hpfracc as hp; print(json.dumps(hp.config.current_provenance().to_dict(), indent=2))"
      - name: Run tests
        run: uv run --frozen python -m pytest
      - name: Check aggregate numerical validation
        run: uv run --frozen python -m benchmarks.numerical.validation_summary --check
      - name: Check selected implicit scientific acceptance
        # Both weight evaluations face the same frozen scientific criteria.
        # Negative controls pass policy only as rejected trajectories.
        run: |
          uv run --frozen python -m benchmarks.numerical.scientific_acceptance --dtype float32 --weight-evaluation direct --check
          uv run --frozen python -m benchmarks.numerical.scientific_acceptance --dtype float32 --weight-evaluation stable --check
          uv run --frozen python -m benchmarks.numerical.scientific_acceptance --dtype float64 --weight-evaluation direct --check
          uv run --frozen python -m benchmarks.numerical.scientific_acceptance --dtype float64 --weight-evaluation stable --check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.21"
          python-version: "3.13"
          enable-cache: true
      - name: Sync locked development environment
        run: uv sync --locked --extra dev
      - name: Lint
        run: uv run --frozen ruff check .

  performance:
    runs-on: ubuntu-latest
    # Timing tests are machine-dependent; report results without gating merges.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.21"
          python-version: "3.13"
          enable-cache: true
      - name: Sync locked development environment
        run: uv sync --locked --extra dev
      - name: Run performance tests
        run: uv run --frozen python -m pytest -m performance

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.21"
          python-version: "3.13"
          enable-cache: true
      - name: Sync locked development environment
        run: uv sync --locked --extra dev
      - name: Build docs
        run: uv run --frozen mkdocs build --strict
